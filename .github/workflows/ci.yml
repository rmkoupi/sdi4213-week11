name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # A real PostgreSQL for tests/test_db_postgres.py: the cloud runs the
    # PostgreSQL path, and test_db.py only covers SQLite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          SQLITE_PATH: ":memory:"
          # A throwaway CI database, not a secret.
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t helpdesk-cloud:${{ github.sha }} .
